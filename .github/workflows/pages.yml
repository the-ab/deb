name: Publish signed APT site

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit containing signed indices
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, deb-pages]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check publication toolchain
        run: |
          for tool in python3 git gpg gpgv tar gzip; do command -v "$tool"; done
      - name: Require exact reviewed source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert expected == os.environ['SOURCE_SHA'], 'main changed; review the new commit first'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
      - name: Assemble verified public files
        run: python3 scripts/repository_assets.py assemble --root "$GITHUB_WORKSPACE" --site "$RUNNER_TEMP/apt-pages-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: pages_artifact
        with:
          path: ${{ runner.temp }}/apt-pages-site
          include-hidden-files: true
          retention-days: 1
      - name: Publish the verified Pages artifact
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          artifact_id = int(os.environ['ARTIFACT_ID'])
          repo_api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
          run_api = f"{repo_api}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          pages_api = f'{repo_api}/pages/deployments'
          sha = os.environ['GITHUB_SHA']

          def request(url, token, payload=None):
              headers = {'Accept': 'application/vnd.github+json', 'Authorization': f'Bearer {token}'}
              data = None
              if payload is not None:
                  headers['Content-Type'] = 'application/json'
                  data = json.dumps(payload).encode()
              with urlopen(Request(url, data=data, headers=headers), timeout=15) as response:
                  return json.load(response)

          token = os.environ['GH_TOKEN']
          for attempt in range(12):
              artifacts = request(f'{run_api}/artifacts?name=github-pages', token)['artifacts']
              if any(item['id'] == artifact_id and item['name'] == 'github-pages'
                     and not item['expired'] for item in artifacts):
                  print(f'GitHub Pages artifact {artifact_id} is visible')
                  break
              if attempt < 11:
                  time.sleep(4)
          else:
              raise SystemExit(f'GitHub Pages artifact {artifact_id} did not become visible')

          oidc = request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'],
                         os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'])['value']
          deployment = request(pages_api, token, {
              'artifact_id': artifact_id, 'pages_build_version': sha, 'oidc_token': oidc,
          })
          deployment_id = str(deployment['id'])
          assert re.fullmatch(r'[a-f0-9]{40}|[0-9]+', deployment_id)
          page_url = deployment['page_url']
          assert page_url.startswith('https://') and '\n' not in page_url and '\r' not in page_url
          print(f'Created GitHub Pages deployment {deployment_id}')
          deadline = time.monotonic() + 420
          while time.monotonic() < deadline:
              try:
                  status = request(f'{pages_api}/{deployment_id}/status', token)['status']
              except HTTPError as error:
                  if error.code != 404 and error.code < 500:
                      raise
              else:
                  if status == 'succeed':
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                          print(f'page_url={page_url}', file=output)
                      break
                  if status in {'deployment_failed', 'deployment_content_failed',
                                'deployment_cancelled', 'deployment_lost'}:
                      raise SystemExit(f'GitHub Pages deployment failed: {status}')
              time.sleep(6)
          else:
              raise SystemExit(f'GitHub Pages deployment {deployment_id} timed out')
          PY
